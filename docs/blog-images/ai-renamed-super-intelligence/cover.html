<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Rename</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
  :root {
    --bg: #0e0d0b;
    --bg2: #16140f;
    --surface: #1a1712;
    --ink: #f4f0e8;
    --ink2: #d6d0c4;
    --ink3: #a39d8f;
    --ink4: #78736a;
    --gold: #c89c65;
    --gold-deep: #a17a4f;
    --gold-mid: #d7b07a;
    --line: rgba(244, 240, 232, 0.1);
    --gold-grad: linear-gradient(135deg, #d7b07a 0%, #a8814f 100%);

    /* layout grid (1x px): header aligns to the ink of "AI" and "SI" */
    --col-l: 198px;
    --col-r: 198px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px; height: 630px; overflow: hidden;
    background: var(--bg);
  }
  body {
    position: relative;
    font-family: "Geist", system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- depth layers ---------- */
  .base {
    position: absolute; inset: 0;
    background:
      radial-gradient(760px 460px at 600px 700px, rgba(200,156,101,0.06), transparent 70%),
      radial-gradient(900px 520px at 600px 260px, rgba(26,23,18,0.9), transparent 75%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgba(244,240,232,0.04) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(244,240,232,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    background-position: 0 18px;
    -webkit-mask-image: radial-gradient(ellipse 560px 300px at 600px 256px, #000 0%, rgba(0,0,0,0.5) 45%, transparent 80%);
            mask-image: radial-gradient(ellipse 560px 300px at 600px 256px, #000 0%, rgba(0,0,0,0.5) 45%, transparent 80%);
  }
  .fx { position: absolute; inset: 0; }
  .grain {
    position: absolute; inset: 0; opacity: 0.06; mix-blend-mode: overlay;
  }

  /* ---------- header ---------- */
  .top {
    position: absolute; top: 60px; left: var(--col-l); right: var(--col-r);
    height: 32px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .eyebrow {
    font-family: "Geist Mono", ui-monospace, monospace;
    font-weight: 500; font-size: 15px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--ink3);
    display: flex; align-items: center; gap: 12px;
    white-space: nowrap;
  }
  .eyebrow .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); flex: none; }
  .eyebrow .sep { color: var(--ink4); }

  .brand { display: flex; align-items: center; gap: 10px; }
  .brand svg { height: 30px; width: auto; display: block; }
  .brand span { font-weight: 700; font-size: 21px; letter-spacing: -0.02em; color: var(--ink); }

  /* ---------- hero lockup ---------- */
  .hero {
    position: absolute; left: 0; right: 0; top: 138px;
    transform: translateX(8px); /* centre the ink bbox (190..994) on the canvas */
    display: flex; align-items: flex-start; justify-content: center;
  }
  .word { display: flex; flex-direction: column; align-items: center; }
  .big {
    font-weight: 800; font-size: 320px; line-height: 0.74;
    letter-spacing: -0.035em;
    padding-right: 0.035em; /* compensate tracking on last glyph */
  }
  .old { color: var(--ink3); }
  .new {
    background: var(--gold-grad);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
  }
  .label {
    margin-top: 28px;
    font-family: "Geist Mono", ui-monospace, monospace;
    font-weight: 500; font-size: 15px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--ink3);
    white-space: nowrap;
  }
  .label.gold { color: var(--gold); }
  .label.optic { transform: translateX(-7px); } /* centre on the AI ink, not its box */
  .arrow {
    width: 190px; height: 60px; flex: none;
    margin: 88.5px 3px 0 8px; /* vertical: centre on cap height; sides: equal optical gaps */
  }

  /* ---------- takeaway block ---------- */
  .take {
    position: absolute; left: 0; right: 0; top: 462px;
    text-align: center;
  }
  .sub {
    font-weight: 800; font-size: 58px; line-height: 1;
    letter-spacing: -0.04em;
  }
  .sub .dim { color: var(--ink3); }
  .foot {
    margin-top: 12px;
    font-weight: 500; font-size: 26px; letter-spacing: -0.015em; color: var(--ink2);
  }
  .foot .arr { color: var(--gold); }
</style>
</head>
<body>
  <div class="base"></div>
  <div class="grid"></div>

  <svg class="grain" width="1200" height="630" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    <rect width="100%" height="100%" filter="url(#n)"/>
  </svg>

  <div class="hero">
    <div class="word">
      <div class="big old">AI</div>
      <div class="label optic">Artificial intelligence</div>
    </div>
    <svg class="arrow" viewBox="0 0 190 60" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="ag" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="186" y2="0">

      <path d="M6 30 H178" stroke="url(#ag)" stroke-width="12" stroke-linecap="round" fill="none"/>

  <div class="take">
